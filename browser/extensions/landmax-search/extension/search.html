<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search</title>
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <header>
    <form id="form" class="bar" autocomplete="off">
      <label class="private" title="Private: signed out, in a throwaway container, nothing remembered">
        <input type="checkbox" id="private"><span class="switch"></span><span>Private</span>
      </label>
      <input id="words" type="search" placeholder="Search" aria-label="Search" autofocus>
      <button type="submit" class="go" aria-label="Search">Search</button>
    </form>
    <div id="sent" class="sent" hidden></div>

    <div class="tools">
      <div class="seg" role="group" aria-label="What to show">
        <button type="button" data-view="summary">Summary</button>
        <button type="button" data-view="web">Web</button>
        <button type="button" data-view="news">News</button>
      </div>
      <select id="when" aria-label="When">
        <option value="">Any time</option>
        <option value="h">Past hour</option>
        <option value="d">Past day</option>
        <option value="w">Past week</option>
        <option value="m">Past month</option>
        <option value="y">Past year</option>
      </select>
      <label class="check" title="Google won't change your words"><input type="checkbox" id="exact"> Exact words</label>
      <label class="check" title="Look inside each result for its picture, read time and junk. Each site sees one visit from this computer, with no cookies."><input type="checkbox" id="inside" checked> Look inside</label>
      <div class="seg right" role="group" aria-label="Layout">
        <button type="button" data-look="auto" title="Cards when the window is tall, a grid when it is wide">Auto</button>
        <button type="button" data-look="grid" title="A grid you sort and filter like a spreadsheet">Grid</button>
        <button type="button" data-look="cards" title="Picture cards">Cards</button>
      </div>
    </div>
    <div id="stats" class="stats" hidden></div>
    <div id="filters" class="filters" hidden></div>
    <div id="views" class="views" hidden></div>
  </header>

  <main id="out">
    <p class="hint">Ask a question for Google's summary, or a few words for plain results. Sort and filter the results like a spreadsheet.</p>
  </main>

  <script src="search.js"></script>
</body>
</html>
