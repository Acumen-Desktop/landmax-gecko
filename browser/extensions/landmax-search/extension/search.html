<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search</title>
  <link rel="stylesheet" href="search.css">
</head>
<body class="home">
  <header id="top">
    <button type="button" id="home" class="mark" title="Back to the start: your recent searches">Search</button>
    <div class="line">
      <div class="nav">
        <button type="button" id="back" class="arrow" title="The search before this one" aria-label="Back">‹</button>
        <button type="button" id="fwd" class="arrow" title="The search after this one" aria-label="Forward">›</button>
      </div>
      <form id="form" class="box" autocomplete="off" role="search">
        <button type="button" id="engine" class="engine" aria-haspopup="true" aria-expanded="false" title="Which search engine to ask"></button>
        <input id="words" type="search" placeholder="Search" aria-label="Search" autofocus>
        <label class="priv" title="Private: signed out of Google, in a throwaway container; this search isn't kept in your history">
          <input type="checkbox" id="private"> Private
        </label>
      </form>
      <button type="button" id="refine" class="quiet" aria-expanded="false" aria-controls="pop">Refine</button>
      <div id="looks" class="looks" role="group" aria-label="Show results as">
        <button type="button" data-look="grid">Grid</button>
        <button type="button" data-look="cards">Cards</button>
      </div>
    </div>
    <div id="engines" class="engines" role="radiogroup" aria-label="Search with"></div>
    <div id="active" class="active" hidden></div>
    <div id="enginemenu" class="menu" hidden></div>

    <div id="pop" class="pop" hidden>
      <section>
        <h3>Ask Google for</h3>
        <label class="row">When
          <select id="when">
            <option value="">Any time</option>
            <option value="h">Past hour</option>
            <option value="d">Past day</option>
            <option value="w">Past week</option>
            <option value="m">Past month</option>
            <option value="y">Past year</option>
          </select>
        </label>
        <label class="row"><input type="checkbox" id="exact"> Exact words <small>Google won't change them</small></label>
        <label class="row"><input type="checkbox" id="news"> News only</label>
        <button type="button" id="again" class="primary" hidden>Search again</button>
      </section>
      <section>
        <h3>Show</h3>
        <label class="row">Order
          <select id="order">
            <option value="rank">Best match</option>
            <option value="age">Newest first</option>
            <option value="read">Shortest read</option>
            <option value="junk">Least junk</option>
          </select>
        </label>
        <label class="row"><input type="checkbox" data-only="reporting"> Reporting only <small>no opinion pieces</small></label>
        <label class="row"><input type="checkbox" data-only="notselling"> Not selling anything</label>
        <label class="row"><input type="checkbox" data-only="free"> Free to read</label>
        <label class="row"><input type="checkbox" data-only="clean"> Clean pages only <small>no ad or tracker companies</small></label>
      </section>
      <section>
        <h3>Results</h3>
        <label class="row"><input type="checkbox" id="inside" checked> Look inside each page
          <small>for its picture, read time and junk: the first 300 KB of each result, no scripts, no cookies. Off is lighter for old computers</small></label>
        <div id="sites"></div>
      </section>
    </div>
  </header>

  <section id="recent" class="recent" aria-label="Your recent searches"></section>

  <main id="main" hidden>
    <nav id="list" class="list" aria-label="Results"></nav>
    <article id="detail" class="detail" aria-live="polite"></article>
  </main>

  <script src="search.js"></script>
</body>
</html>
